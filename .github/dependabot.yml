# Version updates, one grouped PR per ecosystem a month. Security updates
# arrive on their own whenever an advisory lands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      uv:
        patterns: ["*"]
        update-types: [minor, patch]
