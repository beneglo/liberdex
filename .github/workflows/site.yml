name: site

# The static page under site/, published with GitHub Pages.
# Settings > Pages > Source must be "GitHub Actions" once; after that every
# push that touches site/ deploys to beneglo.github.io/liberdex.
# To move it to liberdex.net later: add site/CNAME containing "liberdex.net",
# point the domain's DNS at GitHub Pages, and set the custom domain in
# Settings > Pages.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
