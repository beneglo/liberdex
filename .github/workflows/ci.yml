name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows is informative only.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: uv run ruff check liberdex tests
      - run: uv run pytest -q
      - name: the wheel installs and the CLI answers
        run: |
          uv build
          uv run --isolated --with dist/*.whl --no-project -- liberdex --version
          uv run --isolated --with dist/*.whl --no-project -- liberdex install codex --dry-run --command "uvx --from git+https://github.com/beneglo/liberdex liberdex mcp"

  image:
    # The Dockerfile is verified on every push; release.yml pushes it on tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: liberdex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: the container answers /health with the models baked in
        run: |
          docker run -d --name lx -p 8080:8080 -e LIBERDEX_PLANNER=none liberdex:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/health && break
            sleep 2
          done
          curl -fsS localhost:8080/health | grep -q '"ok":true'
          curl -fsS 'localhost:8080/search?q=tcp+handshake&top_k=3' | head -c 300
          docker logs lx | tail -20
