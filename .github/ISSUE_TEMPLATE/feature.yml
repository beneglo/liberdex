name: Feature
description: Something liberdex should do and does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do and where liberdex stopped short. A concrete query helps.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would change, if you have a view. Optional.
  - type: checkboxes
    id: scope
    attributes:
      label: Fit
      options:
        - label: This does not need a crawler, an index, or another search engine's API.
          required: true
